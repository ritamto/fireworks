<body>
  <canvas id="c"></canvas>
  <style>
    body { margin: 0; overflow: hidden; background: black; cursor: crosshair; }
  </style>
  <script>
    const ctx = c.getContext("2d");
    let W, H, audio;
    let live = 0;               
    let last = 0;               // time of the last interaction
    let rockets = [];
    let sparks = [];
    let yaw = 0, pitch = 0.3;
    let down = 0, moved = 0;
    let finale = 0;    

    onresize = () => {
      W = c.width = innerWidth;
      H = c.height = innerHeight;
    };
    onresize();

   
    function wake() {
      live = 1;
      audio ||= new AudioContext();
      last = Date.now();
    }

    function tone(type, a, b, dur, vol) {
      if (!live) return;
      const o = audio.createOscillator();
      const g = audio.createGain();
      const t = audio.currentTime;
      o.type = type;
      o.frequency.setValueAtTime(a, t);
      o.frequency.exponentialRampToValueAtTime(b, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(audio.destination);
      o.start(t);
      o.stop(t + dur);
    }

    
    let noise; 
function crackle() {
  if (!live) return;
  if (!noise) {
    const n = audio.sampleRate / 2;
    noise = audio.createBuffer(1, n, audio.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < n; i++) {
      d[i] = Math.random() < 0.03 ? (Math.random() * 2 - 1) * (1 - i / n) : 0;
    }
  }
  const src = audio.createBufferSource();
  const g = audio.createGain();
  src.buffer = noise;
  g.gain.value = 0.4;
  src.connect(g).connect(audio.destination);
  src.start();
}

    function launch(x, y) {
  if (rockets.length > 20) return;   
  rockets.push({ x, y: H, targetY: y });
  tone("sawtooth", 300, 1200, 0.9, 0.03);
}
    onpointerdown = () => {
      wake();
      down = 1;
      moved = 0;
    };
    onpointermove = e => {
      if (down) {
        yaw += e.movementX * 0.005;
        pitch += e.movementY * 0.005;
        moved += Math.abs(e.movementX) + Math.abs(e.movementY);
      }
    };
    onpointerup = e => {
      down = 0;
      last = Date.now();
      if (moved < 5) launch(e.clientX, e.clientY);
    };

  
   onkeydown = e => {
  if (e.code == "Space" && !e.repeat && !finale) {
    finale = 1;
    setTimeout(() => (finale = 0), 2000); 
    wake();
    for (let i = 0; i < 8; i++) {
      setTimeout(() => launch(Math.random() * W, Math.random() * H * 0.5), i * 150);
    }
  }
};

    

    function explode(cx, cy) {
      const hue = Math.random() * 360;
      for (let i = 0; i < 120; i++) {
        const z = Math.random() * 2 - 1;
        const a = Math.random() * 6.28;
        const r = Math.sqrt(1 - z * z);
        const speed = 3.5 + Math.random() * 1.5;
        sparks.push({
          cx, cy,
          x: 0, y: 0, z: 0,
          vx: r * Math.cos(a) * speed,
          vy: r * Math.sin(a) * speed,
          vz: z * speed,
          life: 1,
          hue: hue + Math.random() * 40,
        });
      }
      tone("sine", 140, 30, 0.6, 0.5); // boom
      setTimeout(crackle, 200);        // sizzle  boom
    }

    function frame() {
      yaw += 0.004;
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const cp = Math.cos(pitch), sp = Math.sin(pitch);

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "rgba(0,0,0,.2)";
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";

      if (!live) {
        ctx.fillStyle = "white";
        ctx.fillText("click to launch, Also try space bar and dragging", 20, 30);
      }

      rockets = rockets.filter(r => {
        r.y += (r.targetY - r.y) * 0.07;
        ctx.fillStyle = "orange";
        ctx.fillRect(r.x, r.y, 3, 8);
        if (r.y - r.targetY < 8) {
          explode(r.x, r.y);
          return false;
        }
        return true;
      });

      sparks = sparks.filter(s => {
        s.vy += 0.05;
        s.vx *= 0.98; s.vy *= 0.98; s.vz *= 0.98;
        s.x += s.vx; s.y += s.vy; s.z += s.vz;
        s.life -= 0.012;

        const x1 = s.x * cy - s.z * sy;
        const z1 = s.x * sy + s.z * cy;
        const y1 = s.y * cp - z1 * sp;
        const z2 = s.y * sp + z1 * cp;

        const k = 400 / (400 + z2);
        ctx.fillStyle = `hsla(${s.hue},100%,60%,${s.life})`;
        ctx.fillRect(s.cx + x1 * k, s.cy + y1 * k, 2 * k + 1, 2 * k + 1);
        return s.life > 0;
      });

      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
